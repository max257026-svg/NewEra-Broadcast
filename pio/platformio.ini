; ============================================================
;  新启年工作室广播器 - ESP32-S3 PlatformIO 工程
;  用法: pio run -t upload  (或 pio run -t upload -t monitor)
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
; 板子有两条 USB 通路: 原生 USB(VID 303A) 和 CH343 UART 桥(VID 1A86)
; 当前走 CH343 口(COM4); 改插原生口就把端口改成 pio device list 显示的那个
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
